services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meridian
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meridian}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://meridian:${POSTGRES_PASSWORD:-meridian}@db:5432/meridian
      APP_DEMO_MODE: ${APP_DEMO_MODE:-false}
      CRAWL_ENABLED: 'false'
    depends_on:
      db: { condition: service_healthy }
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
  web:
    build: ./frontend
    depends_on: [api]
    ports: ["127.0.0.1:8080:80"]
volumes:
  postgres_data:
