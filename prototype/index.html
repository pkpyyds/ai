<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meridian · 选品工作台原型</title><style>
:root{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#253148;background:#f5f7fa;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #74c4bb}.app{display:flex;min-height:100vh}.side{width:232px;background:#13263d;color:#aab9ca;display:flex;flex-direction:column;padding:25px 14px;position:fixed;inset:0 auto 0 0;overflow:auto}.brand{display:flex;gap:11px;align-items:center;color:white;font-size:17px;font-weight:700;padding:0 10px 32px;letter-spacing:.02em}.logo{width:34px;height:34px;border-radius:10px;background:#42b8a5;display:grid;place-items:center;color:#fff;font-size:19px}.brand small{display:block;color:#8295aa;font-size:10px;font-weight:400;letter-spacing:.08em;margin-top:3px}.nav-label{font-size:10px;letter-spacing:.13em;color:#637b91;margin:17px 12px 9px}.nav{border:0;background:transparent;color:#a8b9cb;text-align:left;padding:11px 12px;border-radius:7px;width:100%;display:flex;align-items:center;gap:12px;margin:2px 0}.nav:hover{background:#1c344f;color:#fff}.nav.active{color:#fff;background:#28465d;box-shadow:inset 3px 0 #48c3ad}.ni{width:17px;text-align:center;font-size:16px}.sidefoot{margin-top:auto;border-top:1px solid #294056;padding:18px 10px 0;font-size:12px;line-height:1.8}.sidefoot b{display:block;color:#d6e0e8}.main{margin-left:232px;width:calc(100% - 232px)}.top{height:70px;background:#fff;border-bottom:1px solid #e8edf1;display:flex;align-items:center;justify-content:space-between;padding:0 35px}.crumb{color:#96a2b0;font-size:12px}.crumb strong{color:#445269;font-weight:600}.topright{display:flex;align-items:center;gap:18px;color:#718094;font-size:12px}.tag-demo{background:#fff6e8;color:#b5761e;border:1px solid #f8e0b7;border-radius:5px;padding:5px 8px}.avatar{width:31px;height:31px;background:#e2f4ef;color:#248d7d;display:grid;place-items:center;border-radius:50%;font-weight:700}.content{padding:31px 35px 45px;max-width:1600px;margin:auto}.welcome{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:25px}.eyebrow{font-size:11px;color:#78918e;letter-spacing:.11em;font-weight:700;text-transform:uppercase;margin-bottom:9px}.welcome h1{font-size:25px;margin:0 0 8px;color:#1b2e43;letter-spacing:.01em}.welcome p{margin:0;color:#8b99a8;font-size:13px}.primary,.secondary{border:1px solid #dfe7e9;border-radius:7px;padding:10px 15px;font-size:12px;font-weight:600;background:#fff;color:#526477}.primary{background:#2aa894;color:#fff;border-color:#2aa894}.primary:hover{background:#218d7d}.secondary:hover{border-color:#75bcaf}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:18px}.card{background:white;border:1px solid #e8edf0;border-radius:9px;box-shadow:0 2px 6px #1a344007}.stat{padding:19px 21px}.stat-top{display:flex;justify-content:space-between;align-items:center;color:#8a98a8;font-size:12px}.stat-icon{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;background:#e9f7f4;color:#38a998;font-size:16px}.stat strong{display:block;font-size:27px;color:#24364b;margin:13px 0 7px}.stat small{font-size:11px;color:#9ba9b7}.stat small em{font-style:normal;color:#2cad94}.grid{display:grid;grid-template-columns:1.65fr 1fr;gap:16px;margin-bottom:17px}.panel{padding:21px}.panel-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:15px}.panel-head h2{font-size:15px;margin:0 0 6px;color:#26394d}.panel-head p{font-size:11px;color:#9ba9b7;margin:0}.link{border:0;background:none;color:#2aa894;font-size:12px;padding:3px}.chart{height:195px;width:100%;display:block}.chart-labels{display:flex;justify-content:space-between;color:#acb7c1;font-size:10px;padding:0 7px}.flow{display:grid;gap:12px;padding-top:2px}.flow-row{display:flex;align-items:center;gap:12px}.dot{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:#e8f7f3;color:#2ba992}.flow-text{flex:1}.flow-text b{font-size:12px;color:#405168;display:block}.flow-text small{font-size:10px;color:#a8b4bf}.badge{display:inline-block;border-radius:4px;background:#e9f7f2;color:#269c80;font-size:10px;padding:5px 8px;white-space:nowrap}.badge.amber{background:#fff5e6;color:#b9832e}.badge.blue{background:#eef4fb;color:#6488b4}.badge.gray{background:#f1f3f5;color:#81909f}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}th{font-size:11px;color:#a4afba;font-weight:500;padding:11px 12px;background:#f9fafb}td{font-size:12px;color:#5c6d7e;border-bottom:1px solid #f1f3f5;padding:13px 12px}tr:last-child td{border-bottom:0}.prod{display:flex;align-items:center;gap:10px}.thumb{width:36px;height:36px;border-radius:7px;background:#f0f5f3;display:grid;place-items:center;font-size:18px}.prod b{display:block;font-size:12px;color:#33465a}.prod small{color:#a7b2bd;font-size:10px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}input,select{border:1px solid #e1e7eb;background:#fff;padding:10px 12px;border-radius:6px;color:#56677a;outline:none}input:focus,select:focus{border-color:#45b29f}.notice{background:#f0f8f6;color:#537d74;border:1px solid #d9eee8;border-radius:7px;padding:12px 15px;margin:0 0 18px;font-size:12px;line-height:1.6}.empty{padding:60px;text-align:center;color:#a0adb9}.footnote{font-size:11px;color:#a9b5bf;margin-top:15px}.modal-bg{position:fixed;inset:0;background:#10263d99;display:grid;place-items:center;z-index:5;padding:20px}.modal{background:#fff;border-radius:10px;padding:26px;width:min(440px,100%);box-shadow:0 15px 60px #10263d44}.modal h2{margin:0 0 10px;font-size:19px}.modal p{color:#8291a1;line-height:1.8}.modal label{display:block;font-size:12px;color:#647587;margin:15px 0 6px}.modal input,.modal select{width:100%}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}.toast{position:fixed;right:25px;bottom:25px;padding:12px 17px;color:#fff;background:#233c4b;border-radius:7px;z-index:9}.hide{display:none}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.side{width:65px;padding:20px 8px}.brand{padding:0 6px 25px}.brand-text,.nav-label,.nav span:not(.ni),.sidefoot{display:none}.nav{justify-content:center;padding:12px 3px}.main{margin-left:65px;width:calc(100% - 65px)}.content{padding:25px 18px}.top{padding:0 18px}.topright .context{display:none}}@media(max-width:520px){.stats{grid-template-columns:1fr 1fr;gap:8px}.stat{padding:14px}.stat strong{font-size:22px}.welcome{flex-direction:column}.content{padding:20px 12px}.tag-demo{display:none}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">✳</div><div class="brand-text">Meridian<small>CROSS-BORDER INTELLIGENCE</small></div></div><div class="nav-label">工作空间 / WORKSPACE</div><nav id="nav"></nav><div class="sidefoot"><b>◈ &nbsp; 系统状态</b>原型演示 · 无真实平台连接<br>© Meridian workspace</div></aside><main class="main"><header class="top"><div class="crumb">工作空间 &nbsp; / &nbsp; <strong id="crumb">工作台</strong></div><div class="topright"><span class="tag-demo">● &nbsp; 原型演示数据</span><span class="context">◷ &nbsp; 数据仅用于交互演示</span><span class="avatar">运</span><span class="context">运营人员 ▾</span></div></header><div class="content" id="content"></div></main></div><div id="dialog"></div><div id="toast" class="toast hide" role="status"></div><script>
const items=[['dashboard','▦','工作台'],['pool','▧','商品池'],['candidates','◇','候选池'],['content','✦','内容生成'],['review','☑','内容审核'],['listing','↗','上架任务'],['rules','⚙','筛选规则'],['audit','≡','审核逻辑'],['crawl','◷','采集任务'],['logs','▤','操作审计']];
let products=[{id:'SP-1001',name:'便携式旅行收纳袋',category:'家居收纳',price:'$ 24.90',profit:'$ 8.40',status:'待初核',icon:'◧'},{id:'SP-1002',name:'不锈钢保温咖啡杯',category:'厨房用品',price:'$ 19.80',profit:'$ 6.20',status:'待初核',icon:'◒'},{id:'SP-1003',name:'桌面理线收纳盒',category:'办公用品',price:'$ 16.50',profit:'$ 5.10',status:'待初核',icon:'▣'}],candidates=[{id:'SP-1004',name:'可折叠笔记本支架',category:'办公用品',price:'$ 29.90',profit:'$ 10.20',status:'待复核',icon:'⌁'}],jobs=[],logs=[];
let current='dashboard',search='',filter='全部';
const $=s=>document.querySelector(s);function escapeHTML(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(t){let e=$('#toast');e.textContent=t;e.classList.remove('hide');setTimeout(()=>e.classList.add('hide'),2600)}
function nav(){ $('#nav').innerHTML=items.map(([id,icon,label])=>`<button class="nav ${current===id?'active':''}" data-nav="${id}" title="${label}"><span class="ni">${icon}</span><span>${label}</span></button>`).join(''); $('#crumb').textContent=items.find(x=>x[0]===current)[2] }
function head(title,sub,button='',action=''){return `<div class="welcome"><div><div class="eyebrow">MERIDIAN / ${current.toUpperCase()}</div><h1>${title}</h1><p>${sub}</p></div>${button?`<button class="primary" data-action="${action}">${button}</button>`:''}</div>`}
function productTable(data,kind){let rows=data.filter(p=>(p.name+p.id+p.category).toLowerCase().includes(search.toLowerCase())&&(filter==='全部'||p.category===filter));return `<div class="table-wrap"><table><thead><tr><th>商品信息</th><th>类目</th><th>参考售价</th><th>预估毛利</th><th>状态</th><th>操作</th></tr></thead><tbody>${rows.map(p=>`<tr><td><div class="prod"><span class="thumb">${p.icon}</span><div><b>${escapeHTML(p.name)}</b><small>${p.id} · 示例商品</small></div></div></td><td>${p.category}</td><td>${p.price}</td><td>${p.profit}</td><td><span class="badge amber">${p.status}</span></td><td><button class="link" data-action="${kind}" data-id="${p.id}">查看并核验 →</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">没有匹配的示例商品</td></tr>'}</tbody></table></div>`}
function dashboard(){return head('工作台','欢迎回来，在这里掌握选品与内容的整体进展。','＋ 新建采集任务','new-crawl')+`<div class="stats"><div class="card stat"><div class="stat-top">商品池 <span class="stat-icon">▧</span></div><strong>${products.length}</strong><small><em>●</em> 待处理的示例商品</small></div><div class="card stat"><div class="stat-top">候选池 <span class="stat-icon">◇</span></div><strong>${candidates.length}</strong><small><em>●</em> 等待第二次人工核验</small></div><div class="card stat"><div class="stat-top">内容任务 <span class="stat-icon">✦</span></div><strong>${jobs.length}</strong><small><em>●</em> 原型内创建的示例任务</small></div><div class="card stat"><div class="stat-top">待审核内容 <span class="stat-icon">☑</span></div><strong>${jobs.filter(j=>j.status==='待人工审核').length}</strong><small>需人工确认后进入下一步</small></div></div><div class="grid"><section class="card panel"><div class="panel-head"><div><h2>选品概览</h2><p>示例趋势 · 仅用于界面展示</p></div><span class="badge gray">近 7 天 ▾</span></div><svg class="chart" viewBox="0 0 600 195" preserveAspectRatio="none" aria-label="示例趋势图"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#63c8b4" stop-opacity=".22"/><stop offset="1" stop-color="#63c8b4" stop-opacity="0"/></linearGradient></defs><path d="M0 20H600M0 65H600M0 110H600M0 155H600" stroke="#eff2f4" fill="none"/><path d="M0 153 C60 140 75 150 120 125 S190 110 240 115 S300 77 360 88 S435 51 480 62 S550 35 600 27 L600 180 L0 180Z" fill="url(#g)"/><path d="M0 153 C60 140 75 150 120 125 S190 110 240 115 S300 77 360 88 S435 51 480 62 S550 35 600 27" fill="none" stroke="#42b5a0" stroke-width="3"/></svg><div class="chart-labels"><span>周一</span><span>周二</span><span>周三</span><span>周四</span><span>周五</span><span>周六</span><span>周日</span></div></section><section class="card panel"><div class="panel-head"><div><h2>工作流程</h2><p>从发现好商品到准备上架</p></div><button class="link" data-nav="pool">查看详情 →</button></div><div class="flow">${[['▧','选品分析','公开数据 → 货源匹配 → 利润及侵权校验','流程起点'],['◇','两阶段核验','商品池初核 → 候选池复核','人工参与'],['✦','商品内容生成','生成内容 → 可编辑审核逻辑','待模型配置'],['↗','人工审核与上架','人工终审 → 上架任务','方式待确认']].map(x=>`<div class="flow-row"><div class="dot">${x[0]}</div><div class="flow-text"><b>${x[1]}</b><small>${x[2]}</small></div><span class="badge blue">${x[3]}</span></div>`).join('')}</div></section></div><section class="card panel"><div class="panel-head"><div><h2>最近待核验商品</h2><p>先从商品池开始，找到值得关注的好商品</p></div><button class="link" data-nav="pool">查看商品池 →</button></div>${productTable(products,'first')}</section><div class="footnote">说明：所有数据均为虚构示例，不代表真实采集、侵权判断或业务指标。</div>`}
function tablePage(kind){let isPool=kind==='pool',data=isPool?products:candidates;return head(isPool?'商品池':'候选池',isPool?'初次人工核验通过后，商品进入候选池。':'再次人工核验通过后，才可以创建内容任务。')+`<div class="notice">◉ &nbsp; 演示数据：核验操作仅更新当前浏览器内的原型状态，不执行真实业务操作。</div><section class="card panel"><div class="panel-head"><div><h2>${isPool?'待初核商品':'待复核商品'}</h2><p>共 ${data.length} 条示例记录</p></div><span class="badge blue">${isPool?'第一阶段':'第二阶段'}</span></div><div class="toolbar"><input id="search" placeholder="搜索商品名称、编号或类目" value="${escapeHTML(search)}"><select id="filter">${['全部','家居收纳','厨房用品','办公用品'].map(x=>`<option ${filter===x?'selected':''}>${x}</option>`).join('')}</select><button class="secondary" data-action="reset">重置</button></div>${productTable(data,isPool?'first':'second')}</section>`}
function render(){nav();let h='';if(current==='dashboard')h=dashboard();else if(['pool','candidates'].includes(current))h=tablePage(current);else if(current==='content'||current==='review'||current==='listing'){let title={content:'内容生成',review:'内容审核',listing:'上架任务'}[current];let arr=jobs.filter(j=>current==='content'||(current==='review'&&j.status==='待人工审核')||(current==='listing'&&j.status==='待上架处理'));h=head(title,{content:'基于复核通过的候选商品创建内容任务。',review:'审核逻辑执行后，内容仍须经过人工审核。',listing:'上架方式暂未确定，本页仅展示任务记录。'}[current])+`<div class="notice">◉ &nbsp; 原型模拟流程，不调用模型或亚马逊；任何示例结果均不代表真实生成或上架。</div><section class="card panel"><div class="panel-head"><div><h2>${title}列表</h2><p>共 ${arr.length} 条示例记录</p></div></div><div class="table-wrap"><table><thead><tr><th>任务编号</th><th>关联商品</th><th>任务状态</th><th>操作</th></tr></thead><tbody>${arr.map(j=>`<tr><td>${j.id}</td><td>${escapeHTML(j.name)}</td><td><span class="badge blue">${j.status}</span></td><td><button class="link" data-action="job" data-id="${j.id}">查看任务 →</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">暂无任务，完成候选池复核后可创建示例任务</td></tr>'}</tbody></table></div></section>`}else if(current==='rules'||current==='audit'){let rule=current==='rules';h=head(rule?'筛选规则':'审核逻辑',rule?'将利润公式、汇率与筛选条件交给运营配置。':'可编辑的审核规则，支持版本管理与回滚。','＋ 新建草稿',rule?'new-rule':'new-audit')+`<div class="notice">◉ &nbsp; 规则内容、公式口径和权限仍待业务确认；下方为可点击的界面示意，不构成已发布规则。</div><section class="card panel"><div class="panel-head"><div><h2>${rule?'选品筛选规则':'内容审核逻辑'}</h2><p>管理草稿、发布版本与历史记录</p></div><span class="badge gray">尚未配置</span></div><div class="empty">暂无已发布版本<br><br><button class="secondary" data-action="${rule?'new-rule':'new-audit'}">创建示例草稿</button></div></section>`}else if(current==='crawl'){h=head('采集任务','仅规划公开数据采集；合规批准前默认关闭。','＋ 新建采集任务','new-crawl')+`<div class="notice">◉ &nbsp; 平台条款、robots、验证码、反爬、账号风控与数据合规均需确认。原型不会发起采集。</div><section class="card panel"><div class="panel-head"><div><h2>采集任务</h2><p>查看任务状态与失败原因</p></div><span class="badge amber">采集未启用</span></div><div class="empty">暂无真实采集任务</div></section>`}else{h=head('操作审计','查看本次原型交互记录，不连接真实审计系统。')+`<section class="card panel"><div class="panel-head"><div><h2>操作记录</h2><p>仅当前页面会话有效</p></div></div>${logs.length?logs.map(x=>`<p style="border-bottom:1px solid #f1f3f5;padding:12px;color:#627487">◷ &nbsp; ${escapeHTML(x)}</p>`).join(''):'<div class="empty">暂无操作记录</div>'}</section>`}$('#content').innerHTML=h;let q=$('#search');if(q){q.oninput=e=>{search=e.target.value;let pos=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)};$('#filter').onchange=e=>{filter=e.target.value;render()}}}
function modal(title,body,buttons){$('#dialog').innerHTML=`<div class="modal-bg" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-label="${title}"><h2>${title}</h2><p>${body}</p><div class="actions"><button class="secondary" data-action="close">取消</button>${buttons}</div></div></div>`}
function openAction(action,id){if(action==='close'){$('#dialog').innerHTML='';return}if(action==='reset'){search='';filter='全部';render();return}if(action==='new-crawl'){modal('新建采集任务','公开数据采集合规性与字段可得性待确认。原型不发起采集。<label>采集来源</label><select><option>卖家精灵（待确认）</option></select><label>类目或关键词</label><input placeholder="输入关键词">','<button class="primary" data-action="draft">保存示例草稿</button>');return}if(action==='new-rule'||action==='new-audit'){modal(action==='new-rule'?'新建筛选规则草稿':'新建审核逻辑草稿','仅供交互演示，不保存或发布真实规则。<label>规则名称</label><input placeholder="输入规则名称"><label>说明</label><input placeholder="输入规则说明">','<button class="primary" data-action="draft">保存示例草稿</button>');return}if(action==='draft'){$('#dialog').innerHTML='';toast('示例草稿操作已演示，不会保存到服务器');return}if(action==='first'||action==='second'){let p=(action==='first'?products:candidates).find(x=>x.id===id);if(!p)return;modal(action==='first'?'商品初次核验':'候选商品再次核验',`<b>${escapeHTML(p.name)}</b> · ${p.id}<br>示例售价 ${p.price} / 示例毛利 ${p.profit}<br>请结合真实商品与合规证据进行人工判断。<label>核验意见（示例）</label><input placeholder="输入核验意见">`,`<button class="secondary" data-action="reject-${action}" data-id="${id}">驳回</button><button class="primary" data-action="approve-${action}" data-id="${id}">核验通过</button>`);return}if(action.startsWith('approve-')||action.startsWith('reject-')){let first=action.endsWith('first'),arr=first?products:candidates,index=arr.findIndex(x=>x.id===id);if(index<0)return;let p=arr.splice(index,1)[0];if(action.startsWith('approve-')){if(first){p.status='待复核';candidates.push(p)}else jobs.push({id:'CJ-'+(1001+jobs.length),name:p.name,status:'待人工审核'})}logs.unshift(`${p.id} ${first?'初核':'复核'}${action.startsWith('approve-')?'通过':'驳回'}（示例）`);$('#dialog').innerHTML='';toast('示例操作已完成');render();return}if(action==='job'){let j=jobs.find(x=>x.id===id);if(!j)return;modal('任务详情',`${escapeHTML(j.name)} · ${j.id}<br>当前状态：${j.status}<br>这里是示例内容，不由真实模型生成。${j.status==='待上架处理'?'<br>真实上架方式尚未确认。':''}`,j.status==='待人工审核'?`<button class="secondary" data-action="job-reject" data-id="${id}">驳回</button><button class="primary" data-action="job-approve" data-id="${id}">人工审核通过</button>`:'');return}if(action==='job-approve'||action==='job-reject'){let j=jobs.find(x=>x.id===id);if(j){j.status=action==='job-approve'?'待上架处理':'已驳回';logs.unshift(`${j.id} 内容人工审核${action==='job-approve'?'通过':'驳回'}（示例）`)}$('#dialog').innerHTML='';toast('示例审核已记录');render()}}
document.addEventListener('click',e=>{let n=e.target.closest('[data-nav]');if(n){current=n.dataset.nav;search='';filter='全部';render();return}let a=e.target.closest('[data-action]');if(a)openAction(a.dataset.action,a.dataset.id)});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#dialog').innerHTML=''});render();
</script></body></html>
